name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      # A pushed tag is the immutable fallback address promised by ADR-0033.
      # Exercise the real GitHub shorthand after the ref exists remotely.
      - run: pnpm registry:build
      - run: node --experimental-strip-types .github/scripts/tagged-registry-install.ts "$GITHUB_REF_NAME"
      # The publish step below packs `dist/`, and `pnpm pack` archives whatever
      # `dist/` already holds. Without this the tarball that reaches npm is the
      # one artifact the packed proof never inspected — the proof would guard
      # pull requests and not releases (#119). It runs on the publishing commit,
      # so the artifact is proven on the exact commit that publishes it.
      - run: pnpm --filter @whatsappd/example-web exec playwright install --with-deps chromium
      - run: pnpm test:pack
      - name: Publish package family to npm (skip versions already published)
        run: |
          publish() {
            package="$1"
            directory="$2"
            archive="$3"
            version="$(node -p "require('./packages/$directory/package.json').version")"
            if ( cd "$RUNNER_TEMP" && npm view "$package@$version" version ) >/dev/null 2>&1; then
              echo "$package@$version is already on npm — skipping publish."
              return
            fi
            pnpm --filter "$package" pack --pack-destination "$RUNNER_TEMP"
            if [[ "$version" == *-* ]]; then
              prerelease="${version#*-}"
              (cd "$RUNNER_TEMP" && npm publish "$archive-$version.tgz" --provenance --access public --tag "${prerelease%%.*}")
            else
              (cd "$RUNNER_TEMP" && npm publish "$archive-$version.tgz" --provenance --access public)
            fi
          }

          publish whatsappd whatsappd whatsappd
          publish @whatsappd/react react whatsappd-react
      - name: Reinstall and verify the exact published package family
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node --experimental-strip-types packages/whatsappd/smoke/packed-consumer.ts --registry; then
              break
            fi
            if [ "$attempt" -eq 6 ]; then
              exit 1
            fi
            sleep 10
          done
          version="$(node -p "require('./packages/whatsappd/package.json').version")"
          # NOTE: `view` is listed in knip.json's `ignoreBinaries`. knip reads
          # `pnpm <word>` in a workflow as invoking a binary called `<word>`, and
          # `view` is a pnpm builtin (the alias of `pnpm info`) that no dependency
          # could ever satisfy. Delete that entry if these calls ever go away.
          #
          # `pnpm view`, not `npm view`. devEngines.packageManager names pnpm, so
          # npm refuses to run at all from this directory - including a read-only
          # `view` - and 0.4.0-alpha.3 published correctly and then failed its own
          # verification on exactly that. pnpm satisfies the constraint instead of
          # working around it, and needs no `cd` out of the repository.
          #
          # The publish step above still uses `npm publish`, because pnpm has no
          # `--provenance` flag and provenance via OIDC is why this repository
          # stores no npm token. Its `cd "$RUNNER_TEMP"` is that exception, not a
          # pattern to copy.
          #
          # The tag is derived rather than hardcoded to `alpha`: a stable release
          # publishes to `latest`, and asserting `dist-tags.alpha` would have
          # failed the first non-prerelease release for the same shape of reason.
          if [[ "$version" == *-* ]]; then
            prerelease="${version#*-}"
            tag="${prerelease%%.*}"
          else
            tag="latest"
          fi
          for package in whatsappd @whatsappd/react; do
            test "$(pnpm view "$package" "dist-tags.$tag")" = "$version"
            test -n "$(pnpm view "$package@$version" dist.attestations.url)"
          done
