name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # capability observations verify their exact historical commit
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Publish to npm (skip if this version is already published)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if ( cd "$RUNNER_TEMP" && npm view "whatsappd@$VERSION" version ) >/dev/null 2>&1; then
            echo "whatsappd@$VERSION is already on npm — skipping publish."
          else
            pnpm pack --pack-destination "$RUNNER_TEMP"
            cd "$RUNNER_TEMP"
            npm publish "whatsappd-$VERSION.tgz" --provenance --access public
          fi
