name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      # The publish step below packs `dist/`, and `pnpm pack` archives whatever
      # `dist/` already holds. Without this the tarball that reaches npm is the
      # one artifact the packed proof never inspected — the proof would guard
      # pull requests and not releases (#119). It runs on the publishing commit,
      # so the artifact is proven on the exact commit that publishes it.
      - run: pnpm test:pack
      - name: Publish to npm (skip if this version is already published)
        run: |
          VERSION="$(node -p "require('./packages/whatsappd/package.json').version")"
          if ( cd "$RUNNER_TEMP" && npm view "whatsappd@$VERSION" version ) >/dev/null 2>&1; then
            echo "whatsappd@$VERSION is already on npm — skipping publish."
          else
            pnpm --filter whatsappd pack --pack-destination "$RUNNER_TEMP"
            cd "$RUNNER_TEMP"
            npm publish "whatsappd-$VERSION.tgz" --provenance --access public
          fi
