name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # One specific false-green, made unrepeatable. Spreading the parent
  # environment into a spawned `node --test` leaks NODE_TEST_CONTEXT, which
  # makes the child print "run() is being called recursively ... skipping
  # running files" and exit 0. PR #94 carried this from round 1 to round 8 --
  # green on both runtimes, cited in every review receipt, executing nothing.
  proof-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No inherited environment in spawned test processes
        run: |
          if grep -rn '\.\.\.process\.env' packages/whatsappd/tests/ packages/whatsappd/smoke/ .github/scripts/; then
            echo "::error::A test spawns a child with the parent environment. Pass an explicit allowlist instead -- inheriting NODE_TEST_CONTEXT makes a nested 'node --test' skip every file and exit 0."
            exit 1
          fi
          echo "no inherited environment in test and proof programs"

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/convex-backend
      - run: pnpm check
      # Coverage thresholds sit just under the measured numbers (96.04 lines /
      # 87.84 branches / 90.03 functions), so they pass on arrival and ratchet:
      # the gate is what stops the next change lowering them quietly, not a
      # target to climb toward. The TAP output is kept as an artifact because
      # `node --test` prints per-test durations there and nothing was retaining
      # them.
      # `test:report` carries the reporter flags itself rather than taking them
      # as extra argv. Appending them to `pnpm test:coverage` puts them after
      # `--test`, where node reads them as another test path and writes nothing
      # -- an artifact step that uploads an empty file and stays green.
      - name: Test with coverage thresholds
        run: pnpm test:report
      - name: Keep the timing and coverage record
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-node${{ matrix.node }}
          path: .artifacts/test-results.tap
          if-no-files-found: error
          retention-days: 30
      # The agent-facing docs are checked against the repository they describe.
      # `AGENTS.md` routes an agent onward by bare relative path, so a path that
      # has moved sends it to read nothing and continue anyway -- and a renamed
      # script makes the documented proof unrunnable for whoever is following
      # instructions rather than improvising. #128 repaired exactly this drift
      # by hand.
      - run: pnpm check:docs
      # The dependency graph must stay free of unused files and packages.
      - run: pnpm check:unused
      - run: pnpm docs:build
      - run: pnpm registry:test
      # Build duration is recorded rather than gated. It is genuinely useful --
      # a build that creeps from one second to thirty is a real regression --
      # but shared runners vary enough that any threshold tight enough to catch
      # that would also fail on a noisy neighbour, and a flaky gate gets
      # disabled rather than investigated. The summary makes the number visible
      # on every run instead.
      - name: Build, and record how long it took
        run: |
          start=$(date +%s%N)
          pnpm build
          elapsed=$(( ($(date +%s%N) - start) / 1000000 ))
          echo "Build: ${elapsed}ms on Node ${{ matrix.node }}" >> "$GITHUB_STEP_SUMMARY"
          echo "build_ms=$elapsed" >> "$GITHUB_OUTPUT"
      # Published size is gated, because unlike duration it is deterministic:
      # the same commit packs to the same bytes on any runner. Every consumer
      # downloads this, and the usual way it doubles is a dependency pulled
      # into the bundle by an import nobody looked at. Measured at 74,532 bytes;
      # the ceiling leaves room to grow deliberately and not silently.
      - name: Publish size
        run: |
          pnpm --filter whatsappd pack --pack-destination "$RUNNER_TEMP" >/dev/null
          VERSION="$(node -p "require('./packages/whatsappd/package.json').version")"
          bytes=$(wc -c < "$RUNNER_TEMP/whatsappd-$VERSION.tgz")
          echo "Package: ${bytes} bytes" >> "$GITHUB_STEP_SUMMARY"
          if [ "$bytes" -gt 120000 ]; then
            echo "::error::The published tarball is ${bytes} bytes, over the 120000-byte ceiling. Something entered the bundle -- check for a dependency pulled in by a new import."
            exit 1
          fi
          echo "packed ${bytes} bytes, under the 120000-byte ceiling"
      # `pnpm pack` archives whatever `dist/` already holds, so this check has
      # to build first or it inspects an artifact older than the change under
      # test. The `test:pack` script owns that build, which is why it does not
      # depend on the step above -- and why the step above stays: a broken
      # build should fail as a broken build, not as a packed-check failure two
      # steps later.
      - run: pnpm --filter @whatsappd/example-web exec playwright install --with-deps chromium
      - run: pnpm test:pack
      # Both permanent consumers resolve @whatsappd/react through its package
      # exports, never a source alias. This therefore exercises the same built
      # entry point that the packed-consumer proof installs from the tarball.
      - run: pnpm --filter @whatsappd/example-web test
      - run: pnpm --filter @whatsappd/example-web test:storybook
      - run: pnpm --filter @whatsappd/example-opentui test
