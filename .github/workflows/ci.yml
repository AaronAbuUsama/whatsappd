name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # One specific false-green, made unrepeatable. Spreading the parent
  # environment into a spawned `node --test` leaks NODE_TEST_CONTEXT, which
  # makes the child print "run() is being called recursively ... skipping
  # running files" and exit 0. PR #94 carried this from round 1 to round 8 --
  # green on both runtimes, cited in every review receipt, executing nothing.
  proof-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No inherited environment in spawned test processes
        run: |
          if grep -rn '\.\.\.process\.env' tests/; then
            echo "::error::A test spawns a child with the parent environment. Pass an explicit allowlist instead -- inheriting NODE_TEST_CONTEXT makes a nested 'node --test' skip every file and exit 0."
            exit 1
          fi
          echo "no inherited environment in tests/"

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Coverage thresholds sit just under the measured numbers (95.81 lines /
      # 86.68 branches / 89.55 functions), so they pass on arrival and ratchet:
      # the gate is what stops the next change lowering them quietly, not a
      # target to climb toward. The TAP output is kept as an artifact because
      # `node --test` prints per-test durations there and nothing was retaining
      # them.
      # `test:report` carries the reporter flags itself rather than taking them
      # as extra argv. Appending them to `pnpm test:coverage` puts them after
      # `--test`, where node reads them as another test path and writes nothing
      # -- an artifact step that uploads an empty file and stays green.
      - name: Test with coverage thresholds
        run: pnpm test:report
      - name: Keep the timing and coverage record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node${{ matrix.node }}
          path: test-results.tap
          if-no-files-found: error
          retention-days: 30
      # The agent-facing docs are checked against the repository they describe.
      # `AGENTS.md` routes an agent onward by bare relative path, so a path that
      # has moved sends it to read nothing and continue anyway -- and a renamed
      # script makes the documented proof unrunnable for whoever is following
      # instructions rather than improvising. #128 repaired exactly this drift
      # by hand.
      - run: pnpm check:docs
      # Copy-paste and unused dependencies, both measured rather than assumed:
      # duplication sits at 0.15% against a 0.3% gate, and the dependency graph
      # is clean. Thresholds set at today's numbers are what make the next
      # regression visible.
      - run: pnpm check:dupes
      - run: pnpm check:unused
      - run: pnpm build
      # `pnpm pack` archives whatever `dist/` already holds, so this proof has
      # to build first or it inspects an artifact older than the change under
      # test. The `proof:pack` script owns that build, which is why it does not
      # depend on the step above -- and why the step above stays: a broken
      # build should fail as a broken build, not as a packed-proof failure two
      # steps later.
      - run: pnpm proof:pack
